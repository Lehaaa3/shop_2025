{% extends 'catalog/base.html' %}

{% block content %}
{% csrf_token %}
<div class="col-12">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="col-3">
        </div>
        <div class="col-6">
            <div class="card-header">
                <h3 class="card-title">
                    Вход
                </h3>
            </div>
            <div class="card-body">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Войти</button>
                <a class="p-2 btn btn btn-primary fixed-width-button" href="{% url 'users:register' %}">Регистрация</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
