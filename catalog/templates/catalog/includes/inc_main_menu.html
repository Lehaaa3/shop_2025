<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 box-shadow">
    <h2 class="my-0 mr-md-auto font-weight-normal">Онлайн Магазин</h2>
    <div class="ms-5 ml-3">
        <a class="p-2 btn btn-outline-primary fixed-width-button" href="{% url 'catalog:product_list' %}">Главная</a>
        <a class="p-2 btn btn-outline-primary fixed-width-button" href="{% url 'blog:post_list' %}">Блог</a>
        <a class="p-2 btn btn-outline-primary fixed-width-button" href="{% url 'catalog:contact' %}">Контакты</a>
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary fixed-width-button" href="{% url 'users:profile' %}">Профиль</a>
        <a class="p-2 btn btn-outline-primary fixed-width-button" href="{% url 'users:logout' %}">Выйти</a>
        {% else %}
        <a class="p-2 btn btn-outline-primary fixed-width-button" href="{% url 'users:login' %}">Войти</a>
        {% endif %}
    </div>
</div>
